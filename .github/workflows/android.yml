name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'public/**'
      - 'server/**'
      - 'test/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Endereço do servidor embutido no APK (ex.: https://perfil.exemplo.com). Pode ser alterado depois no app.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Montar app web e sincronizar com o Android
        run: npm run android:sync
        env:
          PERFIL_SERVER_URL: ${{ inputs.server_url || vars.PERFIL_SERVER_URL }}

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: perfil-ia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
